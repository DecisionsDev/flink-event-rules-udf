# Flink 2.2.0 session cluster: one JobManager (runs the SQL client) and one TaskManager
# (runs the UDF). Run `mvn package` first: it creates the two mounted directories.
#
#   target/udf/               flink-decision-udf.jar   the UDF
#   target/decision-service/  loanApproval.jar         the decision service
#
# The decision service is read by the UDF, so it must be mounted on the TaskManager.
x-flink: &flink
  image: flink:2.2.0-scala_2.12-java21
  volumes:
    - ./target/udf:/opt/flink/udfs:ro
    - ./target/decision-service:/opt/flink/decision-service:ro
    - ./sql:/opt/flink/sql:ro

services:
  jobmanager:
    <<: *flink
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager

  taskmanager:
    <<: *flink
    command: taskmanager
    depends_on: [jobmanager]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
